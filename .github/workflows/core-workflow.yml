name: Core workflow
on:
  pull_request:
  push:
    branches: [master]
jobs:
  zero-scroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:ux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-screen-screenshots
          path: artifacts/core-workflow/
